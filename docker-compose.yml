version: '3.8'

services:
  # MySQL 8+ Database Service
  mysql:
    image: mysql:8.0
    container_name: campusconnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-campusconnect}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-Mounika@1324}
    ports:
      - "${DATABASE_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DATABASE_PASSWORD:-Mounika@1324}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - campusconnect-network

  # Spring Boot 3 Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-campusconnect}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-root}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-Mounika@1324}
      JWT_SECRET: ${JWT_SECRET:-4c616d707573436f6e6e6563745365637572654a57545365637265744b6579323032362140232425}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@campusconnect.edu}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Admin@12345}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:80
    ports:
      - "8080:8080"
    networks:
      - campusconnect-network

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusconnect-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    ports:
      - "5173:80"
    networks:
      - campusconnect-network

volumes:
  mysql_data:

networks:
  campusconnect-network:
    driver: bridge
