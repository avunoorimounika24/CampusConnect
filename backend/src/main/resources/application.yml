server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: campusconnect-backend

  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:campusconnect}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:Mounika@1324}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:4c616d707573436f6e6e6563745365637572654a57545365637265744b6579323032362140232425}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    initial-email: ${ADMIN_INITIAL_EMAIL:admin@campusconnect.edu}
    initial-password: ${ADMIN_INITIAL_PASSWORD:Admin@12345}
    initial-name: ${ADMIN_INITIAL_NAME:Campus Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}
